services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mdms-decision:latest
    container_name: mdms-app
    # 宿主端口可通过环境变量 MDMS_HOST_PORT 配置（默认 8080）
    ports:
      - "${MDMS_HOST_PORT:-8080}:8000"
    environment:
      MDMS_DB_PATH: /data/mdms.db
    volumes:
      - mdms-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4); sys.exit(0 if json.load(r)['status']=='ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  # 验收容器：构建后自动运行 pytest 全量测试与 API/HTTP 冒烟场景，
  # 以退出状态码报告结果（0 通过 / 非 0 失败）后退出。
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: mdms-decision:latest
    container_name: mdms-verify
    command: ["python", "verify/run_acceptance.py"]
    environment:
      BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  mdms-data:
